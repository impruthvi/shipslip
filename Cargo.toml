[package]
name = "shipslip"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Deploy with a receipt. Early development."
license = "MIT"
repository = "https://github.com/impruthvi/shipslip"
readme = "README.md"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }
toml = "1.1"

[target.'cfg(unix)'.dependencies]
openssh = { version = "0.11.6", default-features = false, features = ["native-mux"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[features]
integration = []

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["integration"]
