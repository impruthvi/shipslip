[package]
name = "shipslip"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
description = "Deploy Laravel apps over SSH with a preview, a deploy lock, and a receipt."
license = "MIT"
repository = "https://github.com/impruthvi/shipslip"
readme = "README.md"
include = ["/src", "/docs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]
base64 = "0.22"
flate2 = "1.1.10"
fs2 = "0.4"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
toml = "1.1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
openssh = { version = "0.11.6", default-features = false, features = ["native-mux"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[features]
integration = []

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["integration"]

[profile.dist]
inherits = "release"
lto = "thin"
