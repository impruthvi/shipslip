[package]
name = "shipslip-app"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
shipslip = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
serde_json = "1"
